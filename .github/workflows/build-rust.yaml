name: eucalypt build

on:
  push:
    branches: [master, integration/**]
  pull_request:
  workflow_dispatch:
    inputs:
      narrative:
        description: 'Reason for build'
        required: false

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}', github.workflow, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check
        run: cargo check
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit

  test:
    # The prelude mode is in the job name deliberately (eu-1tkk.7.43). This job
    # runs with NO `lib/prelude.blob` — that file is gitignored, so a plain
    # checkout has none — which keeps the source-prelude fallback exercised and
    # is the reason the name says so. A `#[cfg(prelude_blob_ok)]` test compiles
    # to nothing here; its blob-mode counterpart is "Blob-mode cargo tests".
    # A reader seeing this job red should read the failure as "…without a
    # prelude blob", without opening the log.
    name: Test Suite (source-prelude fallback, no blob)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/integration/')) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
      - name: Run lib unit tests under GC stress (eu-swbz)
        # The other EU_GC_STRESS jobs in this workflow (test-gc-verified,
        # test-aarch64-sequential, asan) all run `eu test tests/harness` —
        # none of them exercise `cargo test --lib`, so GC-internal unit tests
        # (eval::memory::{collect,heap}::tests::*) were never gated under this
        # flag. `cargo test --lib` alone is cheap (~3s locally), so this is a
        # small additional step rather than a new job.
        run: cargo test --lib
        env:
          EU_GC_STRESS: "1"
      - name: Test doc examples
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          python3 scripts/test-doc-examples.py --eu ./target/release/eu --timeout 30


  docs-freshness:
    name: Prelude docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Regenerate prelude docs
        run: |
          mkdir -p /tmp/prelude-docs/
          cp -r docs/reference/prelude/supplements /tmp/prelude-docs/supplements
          ./target/release/eu doc --prelude --output-dir /tmp/prelude-docs/
      - name: Check docs are up to date
        run: |
          diff -r /tmp/prelude-docs/ docs/reference/prelude/ --exclude=supplements || {
            echo "Prelude docs are stale. Run: eu doc --prelude --output-dir docs/reference/prelude/"
            exit 1
          }

  test-gc-verified:
    name: GC-verified harness (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Run harness under GC verification
        run: ./target/release/eu test --allow-io tests/harness
        env:
          EU_GC_VERIFY: "2"
          EU_GC_STRESS: "1"
          EU_GC_POISON: "1"

  test-bytecode-blob:
    name: Bytecode + blob harness
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Generate the prelude blob so the *release-shaped* bytecode + blob path
      # is exercised (bytecode is the default engine post eu-enyv). Without
      # this step the binary falls back to the source prelude and the blob
      # path — the one released binaries embed — goes completely untested.
      # That gap let eu-0iba (a `DirectApp` to an unforced global thunk hung
      # every recursive prelude function, e.g. `map`/`filter`) reach
      # release-candidate builds uncaught while every CI job stayed green.
      - name: Generate prelude blob
        run: cargo run --package xtask -- prelude-compile
      - name: Build release binary
        run: cargo build --release
      - name: Run harness on the bytecode + blob path
        run: ./target/release/eu test --allow-io tests/harness

  tick-parity:
    name: Source-prelude tick-parity tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # This test (tests/tick_parity_test.rs) compares default vs
      # --source-prelude tick counts on a fused, strict-recursion fixture
      # and only has teeth when the eu binary it spawns embeds a prelude
      # blob (eu-2sa6.5) — without this step, default and --source-prelude
      # would exercise the identical code path and the comparison would be
      # vacuously true. Generate the blob before `cargo test` so the
      # compiled CARGO_BIN_EXE_eu carries it.
      - name: Generate prelude blob
        run: cargo run --package xtask -- prelude-compile
      - name: Run tick-parity tripwire
        run: cargo test --test tick_parity_test

  diagnostics-blob-mode:
    # The mode is the first thing in the name (eu-1tkk.7.43): this job is the
    # blob-mode half of the `cargo test` matrix, and its counterpart is
    # "Test Suite (source-prelude fallback, no blob)". A reader seeing this
    # job red knows the failure is blob-specific without opening the log.
    name: Blob-mode cargo tests (all mode-sensitive targets)
    runs-on: ubuntu-latest
    env:
      # gate_liveness's `prelude_blob_is_present_when_demanded` turns this into
      # a runtime assertion that `cfg(prelude_blob_ok)` is actually set. Without
      # it, a `prelude-compile` step that silently failed to take effect (the
      # stale-mtime trap below) would leave every gated test compiled out and
      # this whole job green having asserted nothing.
      EU_REQUIRE_PRELUDE_BLOB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: dtolnay/rust-toolchain@stable
      # `lib/prelude.blob` is gitignored, so a plain checkout has none and the
      # binary falls back to the source prelude. That fallback is a genuinely
      # different pipeline — blob-mode prelude globals carry
      # `Smid::global_slot(i)` stamps, the checker takes
      # `run_type_checker_from_blob_core` rather than `run_type_checker`, and
      # tests/diagnostics/DIVERGENCE.md is the checked-in inventory of fixtures
      # that render a different diagnostic in each mode. Blob mode is what a
      # released binary does.
      - name: Generate prelude blob
        run: cargo run --package xtask -- prelude-compile
      # Fail fast, and unmistakably, if the blob did not reach the build —
      # rather than as a puzzling green after everything gated has quietly
      # compiled out.
      #
      # The blob half of the golden diagnostic snapshots (eu-1tkk.7.4) is the
      # sharpest case. A released binary uses the prelude blob, so the blob
      # rendering is the one users see — but only a binary embedding a verified
      # blob can reproduce it, so those two tests are `#[cfg(prelude_blob_ok)]`.
      #
      # This named-test check is kept alongside the sweep below rather than
      # replaced by it. The sweep's zero-test guard asks whether a target ran
      # *anything*; `diagnostics_snapshots` has ungated tests too, so it would
      # stay green with only those running while both blob-gated tests silently
      # vanished. Naming the two is the stronger assertion.
      #
      # `build.rs` re-runs on `lib/prelude.blob` changing by *mtime*: restoring
      # a blob with an older timestamp leaves `prelude_blob_ok` unset, compiles
      # both tests out, and lets `cargo test` exit 0 having run nothing.
      - name: Assert the blob-gated snapshot tests were actually compiled in
        run: |
          cargo test --test diagnostics_snapshots -- --list > /tmp/snap-tests.txt
          cat /tmp/snap-tests.txt
          for t in blob_prelude_snapshots_match divergence_inventory_is_current; do
            grep -q "$t" /tmp/snap-tests.txt || {
              echo "::error::$t is absent from the test list — cfg(prelude_blob_ok) is unset."
              echo "The prelude blob did not reach the build (stale mtime?). Try: touch build.rs"
              exit 1
            }
          done
      # Every prelude-mode-sensitive target, DISCOVERED FROM THE TREE.
      #
      # This step used to name the targets it wanted, and before that the
      # individual tests (`cargo test --test diagnostics_invariants
      # corpus_satisfies_invariants -- --exact`, beside a comment reading
      # "widen as each lands" with nothing enforcing the widening). Both are
      # allowlists, and both leaked: a `--exact` filter that matches nothing
      # exits 0, so a rename removed a gate silently (eu-oxtcq mechanism 3),
      # and a target absent from the list ran blob-less only. That second hole
      # is what bit PR #1104 — a blob-mode-specific fix whose new
      # `tests/harness_test.rs` tests ran in no blob-mode job anywhere, passed
      # on the author's machine and failed on ubuntu and windows.
      #
      # `scripts/blob-mode-tests.sh` derives the target list instead: a target
      # is swept if it spawns the `eu` binary (making the prelude mode a real
      # input) or is gated on `cfg(prelude_blob_ok)` (making it vanish without
      # one). A new test target is therefore covered from its first CI run with
      # no edit here, and `tests/gate_liveness.rs` fails if the discovery rule
      # and the registry drift apart.
      #
      # Each target still runs WHOLE through `scripts/diagnostics-gate.sh`, so
      # the ratchet is unchanged: a known blob-mode failure is named in that
      # script with its bead, skipped in the whole-target run, and required to
      # STILL FAIL on its own — fixing it turns this job red until the line is
      # deleted. Going red on a fix is the mechanism working; delete the line,
      # never loosen the check. The list is EMPTY today, which is the ratchet
      # having already fired once: it was written while eu-7x0r was open, and
      # its two entries went when #1079 landed.
      - name: Run every mode-sensitive target under the blob
        run: scripts/blob-mode-tests.sh

  blob-determinism:
    name: Prelude blob determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The released binary embeds `lib/prelude.blob`, so its generation must
      # be byte-for-byte reproducible: otherwise builds are non-reproducible
      # and blob-path perf is unstable (eu-c2ue). Regenerate the blob twice
      # and assert the two outputs are identical.
      - name: Generate prelude blob (run 1)
        run: |
          cargo run --package xtask -- prelude-compile
          cp lib/prelude.blob /tmp/prelude-run1.blob
      - name: Generate prelude blob (run 2)
        run: |
          cargo run --package xtask -- prelude-compile
          cp lib/prelude.blob /tmp/prelude-run2.blob
      - name: Assert blobs are byte-identical
        run: |
          if ! cmp -s /tmp/prelude-run1.blob /tmp/prelude-run2.blob; then
            echo "::error::prelude.blob generation is non-deterministic (eu-c2ue regression)"
            sha256sum /tmp/prelude-run1.blob /tmp/prelude-run2.blob
            cmp /tmp/prelude-run1.blob /tmp/prelude-run2.blob || true
            exit 1
          fi
          echo "prelude.blob is byte-identical across two runs"
          sha256sum /tmp/prelude-run1.blob

  test-source-prelude:
    name: Source-prelude harness (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Run harness with source prelude
        run: ./target/release/eu test --allow-io tests/harness
        env:
          EU_SOURCE_PRELUDE: "1"

  test-heapsyn-baseline:
    name: HeapSyn harness (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      # Bytecode is the default engine post-flip (eu-enyv); the standard
      # `test` job exercises it. HeapSyn is retained as the A/B perf baseline
      # and differential engine, so run the full harness on it too (behind
      # EU_HEAPSYN=1) to keep the baseline from silently rotting.
      - name: Run harness on HeapSyn baseline engine
        run: ./target/release/eu test --allow-io tests/harness
        env:
          EU_HEAPSYN: "1"
      # The diagnostics invariant gate is a `cargo test` target, so
      # `eu test tests/harness` above never reaches it: until now it ran under
      # NO engine but the default. Its expected-failure markers are per engine
      # (`xfail_engines` in each fixture's sidecar), which only means anything
      # if the gate is actually run on each engine it can name (eu-1tkk.7.17).
      - name: Run the diagnostics invariant gate on HeapSyn
        run: cargo test --test diagnostics_invariants
        env:
          EU_HEAPSYN: "1"

  test-pp-parallelism:
    name: Process-parallelism (Linux, both engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Generate the prelude blob first so the debug binary `cargo test`
      # spawns embeds it and compiles the prelude once (not from source on
      # every spawn) — otherwise the fork test's three spawns under
      # EU_GC_VERIFY=2 are far too slow.
      - name: Generate prelude blob
        run: cargo run --package xtask -- prelude-compile
      # The fork-safety spike (docs/superpowers/reports/2026-07-25-pp-fork-
      # safety-spike.md, risk R7) validated the COW-fork mechanism only on
      # macOS/aarch64. `test_pp_fork_path_equivalence_both_engines` spawns a
      # fresh (single-threaded-at-fork) `eu` binary and forks W workers on the
      # default bytecode engine AND `EU_HEAPSYN=1`, asserting stdout is
      # byte-identical to the sequential oracle. With EU_GC_VERIFY=2 in the job
      # environment (inherited by the spawned binary and its forked workers),
      # this proves the mechanism off macOS (R7), under GC verification in
      # parent and workers, and covers engine equivalence (R5).
      # `test_222_pp_par_equivalence` and `test_error_225_pp_*` cover the
      # sequential codec path and the boundary error, including metadata
      # crossing the boundary (compared as rendered text against `map`, since
      # `=` ignores metadata).
      # `test_pp_gc_collects_during_par_map` is the GC-safety gate: it runs a
      # map with collection happening during it, under EU_GC_STRESS=1 so every
      # collection evacuates, on both the sequential and the fork path. That
      # is coverage EU_GC_VERIFY cannot provide — verification checks
      # reachability from roots, and the bug class it guards against is
      # handles that were never roots.
      - name: Run PP tests (drives fork on both engines under GC verification)
        run: cargo test --test harness_test pp
        env:
          EU_GC_VERIFY: "2"

  test-byte-dispatch-baseline:
    name: Byte-dispatch harness (soak baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      # Pre-decoded dispatch is the default within the bytecode engine as of
      # Phase 2 (eu-vcr8); the standard `test` job exercises it. The
      # byte-dispatch path is retained for the soak period ahead of Phase 3
      # deletion (docs/superpowers/specs/2026-07-13-predecoded-execution-ir-
      # design.md §6, Step D), so run the full harness on it too (behind
      # EU_PREDECODE=0) to keep it from silently rotting before deletion.
      - name: Run harness on byte-dispatch path
        run: ./target/release/eu test --allow-io tests/harness
        env:
          EU_PREDECODE: "0"

  test-aarch64-sequential:
    name: Sequential harness (aarch64 release)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: aarch64-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            aarch64-cargo-registry-
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Run sequential harness with release binary (GC stress)
        run: target/release/eu test --allow-io tests/harness
        env:
          EU_GC_STRESS: "1"

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Build with ASAN
        run: RUSTFLAGS="-Zsanitizer=address" cargo +nightly build --release --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: Run harness with ASAN
        run: ASAN_OPTIONS=detect_leaks=0 ./target/x86_64-unknown-linux-gnu/release/eu test --allow-io tests/harness
        env:
          EU_GC_STRESS: "1"

  wasm:
    name: WASM Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build library for WASM
        run: cargo build --target wasm32-unknown-unknown --lib
      - name: Clippy for WASM
        run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
      - name: wasm-pack build
        run: wasm-pack build --target web
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.108
      - name: Run WASM smoke tests in Node.js
        run: CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo test --target wasm32-unknown-unknown --lib wasm_tests

  release-candidate-linux:
    needs: [lint, test, audit, wasm]
    name: Release Linux x86_64
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: dtolnay/rust-toolchain@stable
      - name: build and install temporary eu
        run: cargo install --path . --target-dir /tmp/eu-install
      - name: prepare build files for new version
        run: |
          export EU_TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          export EU_RUSTC_VERSION="$(rustc --version | awk '{print $2}')"

          eu build.eu -t build-meta > build-meta.yaml.new
          mv -f build-meta.yaml.new build-meta.yaml

          cargo run --package xtask -- prelude-compile

          echo "TAG_NAME=$(eu build.eu -t version)" >> $GITHUB_ENV
      - name: Build release
        run: cargo build --all --release
      - run: |
          strip target/release/eu
          mv target/release/eu target/release/eu_amd64
      - name: run final test with release binary
        run: |
          target/release/eu_amd64 version
          target/release/eu_amd64 test --allow-io tests/harness
      - name: Generate release notes
        run: |
          # Fetch tags created by GitHub releases
          git fetch --tags origin
          # Find the last *published* (non-draft) release tag
          PREV_TAG=$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ] || ! git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            echo "No resolvable previous release tag, using recent log"
            RANGE="HEAD"
            LOG_ARGS="-20"
          else
            echo "Generating changelog since $PREV_TAG"
            RANGE="${PREV_TAG}..HEAD"
            LOG_ARGS=""
          fi
          echo "# Release Notes" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log $LOG_ARGS --no-merges --pretty=format:'%s' "$RANGE" \
            | grep -v '^docs: ' \
            | grep -v '^chore: update.*submodule' \
            | sed 's/^/- /' >> CHANGELOG.md
          echo ""
          echo "Generated CHANGELOG.md:"
          cat CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG.md
          path: CHANGELOG.md
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: eu_amd64
          path: target/release/eu_amd64


  release-candidate-macos:
    needs: [lint, test, audit, wasm]
    name: Release MacOS
    runs-on: macos-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install temporary eu
        run: cargo install --path . --target-dir /tmp/eu-install
      - name: Prepare build files for new version
        run: |
          export EU_TARGET_TRIPLE="aarch64-apple-darwin"
          export EU_RUSTC_VERSION="$(rustc --version | awk '{print $2}')"

          eu build.eu -t build-meta > build-meta.yaml.new
          mv -f build-meta.yaml.new build-meta.yaml

          cargo run --package xtask -- prelude-compile

          echo "TAG_NAME=$(eu build.eu -t version)" >> $GITHUB_ENV
      - name: Build release
        run: cargo build --all --release
      - run: |
          strip target/release/eu
          mv target/release/eu target/release/eu_darwin
      - name: Run final test with release binary
        run: |
          target/release/eu_darwin version
          target/release/eu_darwin test --allow-io tests/harness
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: eu_darwin
          path: target/release/eu_darwin

  release-candidate-linux-arm:
    needs: [lint, test, audit, wasm]
    name: Release Linux aarch64
    runs-on: ubuntu-22.04-arm
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-arm-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm-cargo-registry-
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install temporary eu
        run: cargo install --path . --target-dir /tmp/eu-install
      - name: Prepare build files for new version
        run: |
          export EU_TARGET_TRIPLE="aarch64-unknown-linux-gnu"
          export EU_RUSTC_VERSION="$(rustc --version | awk '{print $2}')"

          eu build.eu -t build-meta > build-meta.yaml.new
          mv -f build-meta.yaml.new build-meta.yaml

          cargo run --package xtask -- prelude-compile

          echo "TAG_NAME=$(eu build.eu -t version)" >> $GITHUB_ENV
      - name: Build release
        run: cargo build --all --release
      - run: |
          strip target/release/eu
          mv target/release/eu target/release/eu_aarch64
      - name: Run final test with release binary
        run: |
          target/release/eu_aarch64 version
          target/release/eu_aarch64 test --allow-io tests/harness
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: eu_aarch64
          path: target/release/eu_aarch64

  release-candidate-windows:
    needs: [lint, test, audit]
    name: Release Windows
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install temporary eu
        run: cargo install --path . --target-dir C:\eu-install
      - name: Prepare build files for new version
        shell: pwsh
        run: |
          $env:EU_TARGET_TRIPLE = "x86_64-pc-windows-msvc"
          $rustcVersion = (rustc --version) -replace 'rustc (\S+).*', '$1'
          $env:EU_RUSTC_VERSION = $rustcVersion
          eu build.eu -t build-meta > build-meta.yaml.new
          Move-Item -Force build-meta.yaml.new build-meta.yaml
          cargo run --package xtask -- prelude-compile
          $tag = eu build.eu -t version
          echo "TAG_NAME=$tag" >> $env:GITHUB_ENV
      - name: Build release
        run: cargo build --all --release
      - name: Rename binary
        run: |
          copy target\release\eu.exe target\release\eu_windows_amd64.exe
      - name: Run final test with release binary
        run: |
          target\release\eu_windows_amd64.exe version
          target\release\eu_windows_amd64.exe test --allow-io tests/harness
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: eu_windows_amd64.exe
          path: target/release/eu_windows_amd64.exe

  prepare-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs:
      - release-candidate-linux
      - release-candidate-linux-arm
      - release-candidate-macos
      - release-candidate-windows
    steps:

      # Checked out into a subdirectory purely to source the licence texts
      # that ship inside each release tarball; keeping it out of the workspace
      # root avoids any collision with the downloaded artefacts below (notably
      # the generated CHANGELOG.md).
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/download-artifact@v4
        with:
          name: eu_darwin

      - uses: actions/download-artifact@v4
        with:
          name: eu_amd64

      - uses: actions/download-artifact@v4
        with:
          name: eu_aarch64

      - uses: actions/download-artifact@v4
        with:
          name: eu_windows_amd64.exe

      - uses: actions/download-artifact@v4
        with:
          name: CHANGELOG.md

      - name: Prepare release packages
        run: |
          mkdir eucalypt-x86_64-linux
          cp eu_amd64 eucalypt-x86_64-linux/eu
          cp repo/LICENSE repo/LICENSE-MIT repo/LICENSE-APACHE eucalypt-x86_64-linux/
          tar -cvzf eucalypt-x86_64-linux.tgz eucalypt-x86_64-linux

          mkdir eucalypt-aarch64-linux
          cp eu_aarch64 eucalypt-aarch64-linux/eu
          cp repo/LICENSE repo/LICENSE-MIT repo/LICENSE-APACHE eucalypt-aarch64-linux/
          tar -cvzf eucalypt-aarch64-linux.tgz eucalypt-aarch64-linux

          mkdir eucalypt-aarch64-osx
          cp eu_darwin eucalypt-aarch64-osx/eu
          cp repo/LICENSE repo/LICENSE-MIT repo/LICENSE-APACHE eucalypt-aarch64-osx/
          tar -cvzf eucalypt-aarch64-osx.tgz eucalypt-aarch64-osx

      - name: Generate SHA256SUMS
        run: |
          sha256sum *.tgz eu_windows_amd64.exe > SHA256SUMS

      - name: Query binary for version number
        run: |
          chmod +x eu_amd64
          FULL_VERSION=$(./eu_amd64 -e eu.build.version -x text)
          # Strip +build metadata for the release tag (semver build metadata
          # is not suitable for GitHub release tags — '+' breaks download URLs
          # and build numbers don't distinguish semantic versions).
          RELEASE_TAG="${FULL_VERSION%%+*}"
          echo "RELEASE_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Check for existing release
        id: check_release
        run: |
          # Use the GitHub API directly to check release status.
          # gh release view can fail silently in CI with default GITHUB_TOKEN.
          HTTP_CODE=$(curl -s -o /tmp/release_response.json -w "%{http_code}" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG")
          if [ "$HTTP_CODE" = "200" ]; then
            IS_DRAFT=$(cat /tmp/release_response.json | jq -r '.draft')
            if [ "$IS_DRAFT" = "false" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "::warning::Release $RELEASE_TAG is already published — skipping draft creation to avoid overwriting release notes."
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "Draft release for $RELEASE_TAG exists — will update it."
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "No existing release for $RELEASE_TAG (HTTP $HTTP_CODE) — will create draft."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: steps.check_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          body_path: CHANGELOG.md
          files: |
            eucalypt-x86_64-linux.tgz
            eucalypt-aarch64-linux.tgz
            eucalypt-aarch64-osx.tgz
            eu_windows_amd64.exe
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
