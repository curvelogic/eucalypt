[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
eucalypt = { path = ".." }
postcard = { version = "1", features = ["alloc"] }
anyhow = "1"
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-eucalypt = { path = "../editors/tree-sitter-eucalypt" }
